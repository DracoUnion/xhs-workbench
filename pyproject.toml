[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-workbench-backend"
version = "0.1.0"
description = "自媒体 AI 工作台后端（OpenAI API + SQLAlchemy 服务层）"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "bcrypt>=4.0.1,<5",
    "structlog>=24.1",
    "redis>=5",
    "celery>=5.4",
    "openai>=1.40",
    # 小红书 HTTP API 客户端（xhs-cli）：签名/传输/终端 QR
    "httpx>=0.27",
    "xhshow>=0.1.9",
    "pycryptodome>=3.20",
    "qrcode>=7.0",
]

[project.scripts]
xhs-workbench = "src.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
# packages 由 find 自动收集，无需显式列出
